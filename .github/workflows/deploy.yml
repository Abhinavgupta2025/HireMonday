name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t thursday1878/backend:latest ./Backend

      - name: Build Frontend Image
        run: |
          docker build -t thursday1878/frontend:latest ./frontend

      - name: Push Backend Image
        run: |
          docker push thursday1878/backend:latest

      - name: Push Frontend Image
        run: |
          docker push thursday1878/frontend:latest

      - name: Deploy to EC2 Kubernetes
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            kubectl rollout restart deployment backend-deployment -n nginx-ns
            kubectl rollout restart deployment frontend-deployment -n nginx-ns
